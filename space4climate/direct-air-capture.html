<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://space4climate.org/carbon-sequestration.html">
  <meta http-equiv="refresh" content="0; url=carbon-sequestration.html">
  <script>
    (function () {
      var h = window.location.hostname.toLowerCase();
      var isLocal = window.location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h === '[::1]';
      var target = isLocal ? 'carbon-sequestration.html' : 'https://space4climate.org/carbon-sequestration.html';
      window.location.replace(target + window.location.hash);
    }());
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://space4climate.org/carbon-sequestration.html">https://space4climate.org/carbon-sequestration.html</a>…</p>
</body>
</html>
