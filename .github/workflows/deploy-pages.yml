name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether Pages site is enabled
        id: pages-site
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              })
              core.setOutput('enabled', 'true')
            } catch (error) {
              if (error.status === 404) {
                core.warning('GitHub Pages is not enabled for this repository yet. Skipping deployment.')
                core.setOutput('enabled', 'false')
                return
              }
              throw error
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5
        if: steps.pages-site.outputs.enabled == 'true'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: steps.pages-site.outputs.enabled == 'true'
        with:
          path: ./space4climate

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages-site.outputs.enabled == 'true'
        continue-on-error: true

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        uses: actions/deploy-pages@v4
        if: steps.pages-site.outputs.enabled == 'true' && steps.deployment.outcome == 'failure'

      - name: Fail if deployment could not be completed
        if: steps.pages-site.outputs.enabled == 'true' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1

      - name: Deployment skipped
        if: steps.pages-site.outputs.enabled != 'true'
        run: echo "GitHub Pages is not enabled for this repository. Enable Pages with GitHub Actions in repository settings, then rerun."
