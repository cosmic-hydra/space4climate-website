name: OpenCode

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for Copilot to execute
        required: true
        type: string
      model:
        description: Model to use
        required: false
        default: github-copilot/claude-3.5-sonnet
        type: string

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      models: read

    steps:
      - name: Run OpenCode via GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          curl -sS "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -d "{\"model\":\"${MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"${PROMPT//\"/\\\"}\"}]}"
